# 明读 —— Windows 打包配置（electron-builder 25.1.8 / Electron 32.3.3 x64）
#
# 两条必须守住的约束：
#   1. koffi 是原生模块（N-API 预编译 .node），**不能进 asar**，否则 require('koffi') 抛
#      "Cannot find the native Koffi module" → F1 旁路钩子直接降级成不可用。
#   2. NVSA 语音包（约 142MB）是运行时下载到 userData/voice-pack 的，**绝不进安装包**。
#      因此 files 用白名单，且不写任何 voice-pack / resources/voice-pack 条目。
appId: com.mingread.app
productName: 明读
copyright: Copyright © 2026 zjh1934. MIT License.

directories:
  # 渲染产物在 dist/（vite 输出），安装包必须另放，避免互相覆盖/被打进包
  output: release
  buildResources: resources

# 白名单：只有下面这些会进 app.asar
files:
  - dist/renderer/**/*
  - src/main/**/*
  - src/preload/**/*
  - src/shared/**/*
  # 只收图标；resources/magnification 走文件末尾的 extraResources。
  # 若写成 resources/**/*，微软 DLL 会同时进 asar 和 resources/ 两份（体积重复，
  # 且 locateDll 实际只用 process.resourcesPath 那份，asar 内副本永远不生效）。
  - resources/icon.png
  - resources/icon.ico
  - package.json
  - LICENSE
  - README.md
  - THIRD-PARTY-NOTICES.md

  # —— 明确排除（白名单之外的兜底，防止目录被误收） ——
  - "!docs/**"
  - "!scripts/**"
  - "!results/**"
  - "!public/**"
  - "!src/renderer/**"
  - "!dist/probe/**"
  - "!dist/smoke/**"
  - "!dist/a11y-verify/**"
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!node_modules/koffi/doc/**"
  - "!node_modules/koffi/docs/**"
  - "!node_modules/koffi/vendor/**"
  # 注意：不要排除 node_modules/koffi/src/koffi/src/** —— 里面的 static.cjs / trampolines.cjs
  # 是运行时代码（.cc/.hh 才是编译期源码），误排除会让 require('koffi') 直接失败。
  - "!node_modules/**/{test,tests,__tests__,example,examples}/**"

asar: true

# koffi 3.x 的原生二进制不在 koffi 包内，而在可选依赖 @koromix/koffi-<platform>-<arch>：
#   node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node
# 两个包都要解包（koffi 的 index.cjs 会去 require @koromix/... 再回落到 build/koffi/<triplet>/koffi.node）。
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*

# 原生模块是 N-API 预编译产物，跨 ABI，不需要 node-gyp 重建（本机也无 VS 构建链）
npmRebuild: false

# 只有窗口图标需要放在 asar 之外（main/index.js 优先读 process.resourcesPath/icon.png）
extraResources:
  - from: resources/icon.png
    to: icon.png
  # v3.0.0：系统放大组件的兜底副本。
  # 背景：本机是精简版 Windows，System32 里的 Magnification.dll 是个 22726 字节的
  # Compact OS 压缩存根（DCS 头，非 PE），加载必然失败。而之前把它排除在包外，
  # 导致「开发环境能用系统放大、装完就退回旧覆盖层」——功能在用户手里等于不存在。
  # 现在的策略：正常 Windows 走 System32 自带文件，这份只在系统缺失时启用。
  - from: resources/magnification
    to: magnification

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: resources/icon.ico # 256x256 多尺寸 ico（16/32/48/64/128/256）
  requestedExecutionLevel: asInvoker # 不要求管理员：热键/钩子是用户级
  artifactName: MingRead-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 明读
  language: "2052" # 简体中文安装向导（LCID 2052 = zh-CN）
  artifactName: MingRead-${version}-安装包.${ext}
  deleteAppDataOnUninstall: false # 保留用户设置与已下载的 voice-pack

publish: null
