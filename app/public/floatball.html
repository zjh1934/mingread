<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>朗读女 Neo 悬浮球</title>
<style>
  /* 视觉基线对齐主界面（theme.js buildPalette 浅色档），一处定义、处处引用：
     紫色主色 #6b5bff / 深色档 #a996ff、纸白 #ffffff、正文 #161b26、次要 #4a5261、
     分隔线 rgba(16,24,40,.14)、错误 #d9344a、警告 #fbbf24→#c47f00。
     尺寸仍由 --ball 驱动（56 / 80 / 112 三档），图标、角标、菜单字号全部按同一变量派生。
     零依赖约束：本页不引 MUI / 外部字体 / 图片，只靠内联 CSS。 */
  html {
    --ball: 56px;
    /* ---- 主界面调色板（与 theme.js 同值，不新增色相）---- */
    --ldn-primary: #6b5bff;
    --ldn-primary-soft: #a996ff;
    --ldn-paper: #ffffff;
    --ldn-ink: #161b26;
    --ldn-ink-2: #4a5261;
    --ldn-divider: rgba(16, 24, 40, 0.14);
    --ldn-error: #d9344a;
    --ldn-error-soft: #fb7185;
    --ldn-warning: #c47f00;
    --ldn-warning-soft: #fbbf24;
    --ldn-hover: rgba(107, 91, 255, 0.14); /* = action.selected（浅色） */
    --ldn-focus: #6b5bff; /* = --ldn-focus-color */
    /* ---- 阴影层级：与主界面 elevation 2 / 8 的观感一致（近距实 + 远距散）---- */
    --ldn-shadow-1: 0 1px 2px rgba(16, 24, 40, 0.18), 0 2px 6px rgba(16, 24, 40, 0.22);
    --ldn-shadow-2: 0 2px 4px rgba(16, 24, 40, 0.14), 0 8px 24px rgba(16, 24, 40, 0.22);
  }
  /* 透明窗口：页面即球本体，无任何外部资源依赖 */
  html, body {
    margin: 0;
    padding: 0;
    width: var(--ball);
    height: var(--ball);
    overflow: hidden;
    background: transparent;
  }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  /* 默认 = st-idle：中性深灰（text.secondary → text.primary），静止态不抢眼，
     但白图标对比度 ≥ 8:1，低视力用户在任意壁纸上都能找到球。 */
  #ball {
    position: relative;
    width: var(--ball);
    height: var(--ball);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--ldn-ink-2) 0%, var(--ldn-ink) 100%);
    box-shadow: var(--ldn-shadow-1), inset 0 1px 0 rgba(255, 255, 255, 0.20);
    transition: filter 0.15s ease, transform 0.08s ease;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  #ball:hover {
    filter: brightness(1.12);
  }
  #ball:active {
    transform: scale(0.94);
  }
  /* st-playing：主色（紫）——与主界面 primary.main 完全同值，配呼吸光环 */
  #ball.st-playing {
    background: linear-gradient(160deg, var(--ldn-primary-soft) 0%, var(--ldn-primary) 100%);
    animation: breathe 1.6s ease-in-out infinite;
  }
  /* st-buffering：警告色（琥珀）——深色图标保证 ≥ 4.5:1 */
  #ball.st-buffering {
    background: linear-gradient(160deg, var(--ldn-warning-soft) 0%, var(--ldn-warning) 100%);
  }
  /* st-conflict：错误色（红）+ 角标；hotkeyOk===false 时优先于播放状态 */
  #ball.st-conflict {
    background: linear-gradient(160deg, var(--ldn-error-soft) 0%, var(--ldn-error) 100%);
  }
  @keyframes breathe {
    0%, 100% {
      box-shadow: var(--ldn-shadow-1), 0 0 0 0 rgba(107, 91, 255, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    50% {
      box-shadow: var(--ldn-shadow-1), 0 0 0 7px rgba(107, 91, 255, 0),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
  }
  #ball svg {
    width: calc(var(--ball) * 0.42);
    height: calc(var(--ball) * 0.42);
    color: #ffffff;
    fill: #ffffff;
    filter: drop-shadow(0 1px 1px rgba(16, 24, 40, 0.28));
    pointer-events: none;
  }
  /* 原本写死的白色描边改成 currentColor：缓冲态换成深色图标时不用改结构 */
  #ball svg path[stroke] {
    stroke: currentColor;
  }
  #ball.st-buffering svg {
    color: var(--ldn-ink);
    fill: var(--ldn-ink);
  }
  .icon-pause {
    display: none;
  }
  #ball.st-playing .icon-speaker {
    display: none;
  }
  #ball.st-playing .icon-pause {
    display: block;
  }
  #badge {
    position: absolute;
    /* 窗口尺寸 == 球直径，负偏移的角标会被窗口裁掉半边（112px 档位实测缺 4px）。
       收到 0.01*ball 仍在球体右上缘，但整枚角标都能画出来。 */
    top: calc(var(--ball) * 0.01);
    right: calc(var(--ball) * 0.01);
    width: calc(var(--ball) * 0.30);
    height: calc(var(--ball) * 0.30);
    border-radius: 50%;
    background: var(--ldn-error);
    color: var(--ldn-paper);
    font-size: calc(var(--ball) * 0.21);
    font-weight: 700;
    line-height: calc(var(--ball) * 0.27);
    text-align: center;
    border: calc(var(--ball) * 0.027) solid var(--ldn-paper);
    box-shadow: var(--ldn-shadow-1);
    display: none;
    pointer-events: none;
  }
  #ball.st-conflict #badge {
    display: block;
  }
  /* 右键自绘菜单：白底卡片 + 1px 分隔线 + 双层阴影，与主界面卡片（paper + divider + 18px 圆角）同语言。
     position:fixed 使其不受 body overflow:hidden 裁剪；
     但球窗口本身只有球体大小，菜单超出部分仍会被窗口裁切——
     由主进程在收到 menu 提示时临时放大球窗口（见 floatBall.js handleMenu）。 */
  #ctx-menu {
    position: fixed;
    z-index: 9999;
    min-width: calc(var(--ball) * 3.2);
    padding: calc(var(--ball) * 0.07);
    border-radius: calc(var(--ball) * 0.18);
    background: var(--ldn-paper);
    color: var(--ldn-ink);
    border: 1px solid var(--ldn-divider);
    box-shadow: var(--ldn-shadow-2);
    font-size: calc(var(--ball) * 0.22);
    -webkit-user-select: none;
    user-select: none;
  }
  #ctx-menu .ctx-item {
    display: block;
    width: 100%;
    padding: calc(var(--ball) * 0.11) calc(var(--ball) * 0.18);
    border: 0;
    border-radius: calc(var(--ball) * 0.11);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    /* 目标尺寸：小档位（56px）保底 44px（WCAG 2.5.5），大档位仍随球体放大。
       上限必须收敛：主进程把菜单窗口高度钳在 600px（floatBall.js handleMenu），
       8 项在 112px 档位下必须放得下——0.60*ball 实测菜单高 573px，留出余量；
       0.62 会到 606px，最下面「隐藏悬浮球」被裁掉 6px。 */
    min-height: max(calc(var(--ball) * 0.60), 44px);
  }
  #ctx-menu .ctx-item:hover {
    background: var(--ldn-hover);
  }
  #ctx-menu .ctx-item:focus-visible {
    outline: 3px solid var(--ldn-focus);
    outline-offset: -3px;
  }
  #ctx-menu hr {
    margin: calc(var(--ball) * 0.07) calc(var(--ball) * 0.1);
    border: 0;
    border-top: 1px solid var(--ldn-divider);
  }
</style>
</head>
<body>
  <div id="ball" class="st-idle" title="朗读女 Neo · 单击朗读当前选中文字" role="button" aria-label="朗读悬浮球">
    <!-- 待机 / 缓冲：小喇叭 -->
    <svg class="icon-speaker" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 9v6h4l5 5V4L7 9H3z" />
      <path d="M16 8.8a4.5 4.5 0 0 1 0 6.4" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <path d="M18.6 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    </svg>
    <!-- 播放中：暂停样式（纯视觉） -->
    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="7" y="5" width="3.6" height="14" rx="1.2" />
      <rect x="13.4" y="5" width="3.6" height="14" rx="1.2" />
    </svg>
    <span id="badge">!</span>
  </div>

<script>
  (function () {
    'use strict';
    var DRAG_THRESHOLD = 5; // 超过 5px 视为拖动，否则视为单击
    var BALL_SIZES = [56, 80, 112];
    var ball = document.getElementById('ball');

    // window.langdu / floatBall 桥不存在时全部静默降级（不报错刷屏）
    function fb() {
      try {
        return (window.langdu && window.langdu.floatBall) || null;
      } catch (e) {
        return null;
      }
    }

    // ---- α：尺寸档位（56 / 80 / 112），由主进程 floatBall:state 下发 ----
    function setSize(px) {
      var n = Number(px);
      if (!isFinite(n) || n <= 0) return;
      var best = BALL_SIZES[0];
      BALL_SIZES.forEach(function (s) {
        if (Math.abs(s - n) < Math.abs(best - n)) best = s;
      });
      document.documentElement.style.setProperty('--ball', best + 'px');
    }

    // ---- 状态：由 floatBall.onState 驱动 ----
    function applyState(s) {
      if (!s || typeof s !== 'object') return;
      if (s.size != null) setSize(s.size);
      // hotkeyOk===false 时无论播放状态都优先 conflict
      var conflict = s.hotkeyOk === false;
      var cls = 'st-idle';
      if (conflict) cls = 'st-conflict';
      else if (s.buffering) cls = 'st-buffering';
      else if (s.isPlaying) cls = 'st-playing';
      ball.className = cls;
      if (conflict) {
        ball.title = '热键 ' + (s.hotkey || 'F1') + ' 被占用，请在设置中更换或关闭占用程序';
      } else if (s.isPlaying) {
        ball.title = '正在朗读 · 单击可重新朗读选中文字';
      } else {
        ball.title = '朗读女 Neo · 单击朗读当前选中文字';
      }
    }

    try {
      var bridge = fb();
      if (bridge && typeof bridge.onState === 'function') bridge.onState(applyState);
    } catch (e) {
      /* 桥不可用时保持静态待机样式 */
    }

    // ---- 拖拽 / 单击 ----
    var session = null;

    function endSession(sendDragEnd) {
      if (!session) return;
      if (sendDragEnd) {
        try {
          var b = fb();
          if (b && typeof b.dragEnd === 'function') b.dragEnd();
        } catch (e) {
          /* 忽略 */
        }
      }
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('mouseleave', onLeave);
      session = null;
    }

    function onMove(e) {
      if (!session) return;
      var dx = e.screenX - session.x;
      var dy = e.screenY - session.y;
      if (!session.dragged && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        session.dragged = true;
      }
      if (session.dragged) {
        e.preventDefault();
        try {
          var b = fb();
          if (b && typeof b.dragMove === 'function') b.dragMove({ dx: dx, dy: dy });
        } catch (err) {
          /* 忽略 */
        }
      }
    }

    function onUp() {
      if (!session) return;
      var wasDragged = session.dragged;
      endSession(wasDragged);
      if (!wasDragged) {
        // 单击：朗读当前选中文字
        try {
          var b = fb();
          if (b && typeof b.cmd === 'function') b.cmd({ cmd: 'read' });
        } catch (e) {
          /* 忽略 */
        }
      }
    }

    // 指针移出球体窗口时结束拖拽，避免球黏在光标上
    function onLeave() {
      if (session) endSession(true);
    }

    ball.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return; // 仅左键
      e.preventDefault();
      session = { x: e.screenX, y: e.screenY, dragged: false };
      try {
        var b = fb();
        if (b && typeof b.dragStart === 'function') b.dragStart();
      } catch (err) {
        /* 忽略 */
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('mouseleave', onLeave);
    });

    // ---- 右键自绘菜单 ----
    // 菜单项全部走既有 floatBall.cmd；zoomIn/zoomOut/zoomExit/hide 需主进程补充处理（见报告）
    var MENU_ITEMS = [
      { label: '朗读选中文字', cmd: 'read' },
      { label: '播放', cmd: 'play' },
      { label: '暂停', cmd: 'pause' },
      { label: '停止', cmd: 'stop' },
      { sep: true },
      { label: '放大一档', cmd: 'zoomIn' },
      { label: '缩小一档', cmd: 'zoomOut' },
      { label: '退出缩放', cmd: 'zoomExit' },
      { sep: true },
      { label: '隐藏悬浮球', cmd: 'hide' },
    ];
    var menuEl = null;

    function sendCmd(cmd) {
      try {
        var b = fb();
        if (b && typeof b.cmd === 'function') b.cmd({ cmd: cmd });
      } catch (e) {
        /* 桥不可用时静默降级 */
      }
    }

    // 提示主进程临时放大/收回球窗口，使菜单完整可见（主进程未实现时忽略）
    function hintMenuResize(open, w, h) {
      try {
        var b = fb();
        if (b && typeof b.cmd === 'function') b.cmd({ cmd: 'menu', open: !!open, width: w, height: h });
      } catch (e) {
        /* 忽略 */
      }
    }

    function onDocDown(e) {
      if (menuEl && !menuEl.contains(e.target)) closeMenu();
    }

    function onDocKey(e) {
      if (e.key === 'Escape') closeMenu();
    }

    function closeMenu() {
      if (menuEl) {
        menuEl.remove();
        menuEl = null;
      }
      document.removeEventListener('mousedown', onDocDown, true);
      document.removeEventListener('keydown', onDocKey, true);
      window.removeEventListener('blur', closeMenu);
      hintMenuResize(false, 0, 0);
    }

    function openMenu(x, y) {
      closeMenu();
      var menu = document.createElement('div');
      menu.id = 'ctx-menu';
      MENU_ITEMS.forEach(function (item) {
        if (item.sep) {
          menu.appendChild(document.createElement('hr'));
          return;
        }
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ctx-item';
        btn.textContent = item.label;
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          sendCmd(item.cmd);
          closeMenu();
        });
        menu.appendChild(btn);
      });
      document.body.appendChild(menu);
      // 菜单实际尺寸随字号档位变化 → 量出来再告诉主进程扩窗口，避免菜单被裁切
      var rect = menu.getBoundingClientRect();
      var px = Math.max(4, Math.min(x, window.innerWidth - rect.width - 4));
      var py = Math.max(4, Math.min(y, window.innerHeight - rect.height - 4));
      menu.style.left = px + 'px';
      menu.style.top = py + 'px';
      menuEl = menu;
      document.addEventListener('mousedown', onDocDown, true);
      document.addEventListener('keydown', onDocKey, true);
      window.addEventListener('blur', closeMenu);
      hintMenuResize(true, Math.ceil(rect.width), Math.ceil(rect.height));
    }

    ball.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      if (session) endSession(false); // 右键不触发拖拽会话
      openMenu(e.clientX, e.clientY);
    });
  })();
</script>
</body>
</html>
